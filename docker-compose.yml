services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-${OLLAMA_CHAT_MODEL:-llama3.2:3b}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-${OLLAMA_EMBED_MODEL:-nomic-embed-text}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama pull "$$CHAT_MODEL"
        ollama pull "$$EMBEDDING_MODEL"

  agent-api:
    build:
      context: .
    ports:
      - "${AGENT_HOST_PORT:-8080}:${AGENT_PORT:-8080}"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      AGENT_HOST: ${AGENT_HOST:-0.0.0.0}
      AGENT_PORT: ${AGENT_PORT:-8080}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-${OLLAMA_BASE_URL:-http://ollama:11434}}
      CHAT_MODEL: ${CHAT_MODEL:-${OLLAMA_CHAT_MODEL:-llama3.2:3b}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-${OLLAMA_EMBED_MODEL:-nomic-embed-text}}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  ollama-models:
