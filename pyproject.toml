[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aigentego"
version = "0.3.0"
description = "Local-first AIgentEgo runtime foundation for Ollama-backed orchestration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Niccolò Ferrari (NickF93)" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2",
  "pydantic-settings>=2",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/aigentego"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
